name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main-3
    paths:
      - 'Day-52/**'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: Day-52

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Day-52/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npx ng build --configuration production --base-href /Genspark-Training/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Day-52/dist/weather-app/browser
