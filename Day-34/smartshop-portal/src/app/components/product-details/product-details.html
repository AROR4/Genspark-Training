<div class="product-details-container">

    @if(isLoading()) {

        <div class="loading">
            Loading product...
        </div>

    } @else if(product()) {

        <div class="product-card">

            <div class="image-section">
                <img
                    [src]="product()!.thumbnail"
                    [alt]="product()!.title">
            </div>

            <div class="info-section">

                <h1>{{ product()!.title }}</h1>

                <p class="brand">
                    Brand: {{ product()!.brand }}
                </p>

                <p class="category">
                    Category: {{ product()!.category }}
                </p>

                <p class="description">
                    {{ product()!.description }}
                </p>

                <p class="price">
                    ₹{{ product()!.price }}
                </p>

                <p class="rating">
                    ⭐ {{ product()!.rating }}
                </p>

            </div>

        </div>

    }

</div>
